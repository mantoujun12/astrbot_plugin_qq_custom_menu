name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    # pre-commit.ci 只覆盖 PR；本 job 兜底直接 push 到 main/master 的提交，
    # 并在 pre-commit.ci 服务不可用时保证 ruff 检查仍然执行。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run hooks (includes ruff check + format)
        run: pre-commit run --all-files --show-diff-on-failure
