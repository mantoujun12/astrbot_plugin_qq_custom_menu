name: CI Dashboard

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard - Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: web/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web/dashboard
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: web/dashboard
        run: pnpm test

      - name: Build dashboard
        working-directory: web/dashboard
        run: pnpm build

      - name: Verify generated pages are up to date
        run: |
          changes="$(git status --porcelain --untracked-files=all -- pages/dashboard)"
          if [[ -n "$changes" ]]; then
            echo "::error::pages/dashboard is out of date. Run pnpm build in web/dashboard and commit the generated files."
            printf '%s\n' "$changes"
            git --no-pager diff --stat -- pages/dashboard
            exit 1
          fi
