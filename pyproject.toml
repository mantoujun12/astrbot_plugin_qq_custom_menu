[tool.ruff]
line-length = 100
extend-exclude = ["data"]
# 插件最低支持 Python 3.10 (代码里统一 from __future__ import annotations)
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle
# F: pyflakes
# I: isort
# UP: pyupgrade
# B: flake8-bugbear
# S: flake8-bandit (S110 = try-except-pass)
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# 入口需要在最外层兜底 exceptions, 集中提示用户即可
"main.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
